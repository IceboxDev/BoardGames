pre-commit:
  # One step at a time, stopping at the first failure: the quick checks first,
  # then the typecheck + tests (scripts/pre-commit-checks.mjs explains why they
  # no longer run all at once).
  piped: true
  commands:
    biome:
      priority: 1
      glob: "*.{ts,tsx,js,jsx,json,css}"
      run: PATH="$HOME/.npm-global/bin:$HOME/.local/share/pnpm:$PATH" npx @biomejs/biome check --no-errors-on-unmatched --files-ignore-unknown=true {staged_files}
    style-guard:
      priority: 2
      glob: "packages/web/src/**/*.{ts,tsx}"
      run: PATH="$HOME/.npm-global/bin:$HOME/.local/share/pnpm:$PATH" node scripts/lint-styles.mjs
    typecheck-and-test:
      priority: 3
      run: PATH="$HOME/.npm-global/bin:$HOME/.local/share/pnpm:$PATH" node scripts/pre-commit-checks.mjs {staged_files}
