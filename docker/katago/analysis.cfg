# KataGo analysis-engine config for the Go game (server/src/katago).
# Values are reported from Black's side: +ownership / +scoreLead are Black's.
reportAnalysisWinratesAs = BLACK
logToStderr = true
logAllRequests = false
logAllResponses = false
logSearchInfo = false

# CPU (Eigen) box: a few positions in parallel, one search thread each.
# Tune from the Phase-0 benchmark on the Railway service.
numAnalysisThreads = 4
numSearchThreadsPerAnalysisThread = 1
nnMaxBatchSize = 8
nnCacheSizePowerOfTwo = 20
nnMutexPoolSizePowerOfTwo = 16

# Per-query maxVisits overrides this.
maxVisits = 400
wideRootNoise = 0.0
